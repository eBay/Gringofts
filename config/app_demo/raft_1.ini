[raft.default]
version = v2
max.batch.size = 2000
max.len.in.bytes = 5000000
max.decr.step = 2000
max.tailed.entry.num = 5
; Optional leader optimizations; unchanged protobuf protocol and on-disk format.
append.entries.raw.enabled = false
; Requires a supporting Linux gRPC TCP backend. gRPC retains its own size threshold.
grpc.tcp.tx.zerocopy.enabled = false

[raft.storage]
storage.type = file
storage.dir = ./node_1
segment.data.size.limit = 67108864     ; 64MB
segment.meta.size.limit = 4194304      ; 4MB

[streaming]
enable                  = true
max.concurrency         = 4
